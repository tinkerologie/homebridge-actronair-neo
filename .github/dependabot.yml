# Dependabot (tinkerologie standard: see STANDARDS.md in tinkerologie/.github)
version: 2

updates:
  # Third-party actions are pinned to commit SHAs for supply-chain safety, which means nothing
  # updates them unless something is watching. Dependabot understands pinned SHAs and rewrites
  # both the SHA and its trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Homebridge v2 is the supported runtime; a v3 bump is a deliberate porting decision,
      # not something to merge from a dependency PR.
      - dependency-name: homebridge
        update-types: [version-update:semver-major]
      # TypeScript majors are held back by typescript-eslint's peer range, so an automatic
      # major here produces a PR that cannot pass CI.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node must track the OLDEST runtime in `engines` (Node 22), not the newest
      # release. Types describing a newer Node let tsc accept APIs that do not exist on a
      # supported version — it compiles here and throws for the user. CI cannot catch this:
      # the types are what tell tsc the call is valid.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
