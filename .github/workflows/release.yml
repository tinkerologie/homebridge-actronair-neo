name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Everything that runs project or dependency code (install scripts, build) happens here
  # with a read-only token and no OIDC identity. The Publish job only uploads the tarball
  # built here.
  package:
    name: Package
    needs: test
    if: github.repository == 'tinkerologie/homebridge-actronair-neo'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    outputs:
      version: ${{ steps.check.outputs.version }}
      tagged: ${{ steps.check.outputs.tagged }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false

      # Does package.json name a version that has not been released yet? Everything below is
      # skipped when it doesn't, so a normal commit to main is a no-op here rather than a
      # failure, and re-running this workflow cannot double-publish.
      - name: Determine whether this version needs releasing
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already tagged — nothing to release."
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v$VERSION"
          fi

          # Tracked separately from the tag: a version published by hand has no tag, and one
          # tagged after a failed publish has no package. Each step checks its own condition.
          if curl -sf "https://registry.npmjs.org/$NAME/$VERSION" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.tagged == 'false' && steps.check.outputs.published == 'false'
        run: npm ci

      # The Test job already ran lint and tests on this commit; build the dist/ that ships.
      - name: Build
        if: steps.check.outputs.tagged == 'false' && steps.check.outputs.published == 'false'
        run: npm run build

      # --ignore-scripts keeps prepublishOnly and prepack from running again while packing.
      - name: Pack the package
        if: steps.check.outputs.tagged == 'false' && steps.check.outputs.published == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"

      - name: Hand the package to the Publish job
        if: steps.check.outputs.tagged == 'false' && steps.check.outputs.published == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7 # long enough to re-run a failed Publish job

  # The only job with write access and an OIDC identity. It does not check out the
  # repository or install anything: it publishes the tarball the Package job built.
  publish:
    name: Publish
    needs: package
    if: needs.package.outputs.tagged == 'false'
    runs-on: ubuntu-latest
    # One publish at a time: a racing run then finds this run's package on npm and
    # skips (same tarball) or fails on the integrity check; it never publishes twice.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
      # Queue every pending release rather than only the newest (actionlint 1.7.12 does
      # not know `queue` yet; GitHub accepts it).
      queue: max
    # Must match the environment configured on npm's trusted publisher, or the OIDC claim will
    # not match and npm refuses the publish.
    environment: release
    permissions:
      # id-token lets npm verify this workflow via OIDC, so no long-lived token is stored
      # anywhere. It is also what allows npm to attach build provenance.
      id-token: write # trusted publishing (OIDC) to npm, with provenance
      contents: write # create the GitHub release and tag
    steps:
      - name: Download the package
        if: needs.package.outputs.published == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.package.outputs.published == 'false'
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1+, and an older npm fails with an authentication
      # error that looks nothing like a version problem. Node 24 bundles a new enough npm,
      # so check it rather than install anything in this job.
      - name: Check npm supports trusted publishing
        if: needs.package.outputs.published == 'false'
        run: |
          NPM_VERSION="$(npm --version)"
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$NPM_VERSION"; then
            echo "::error::npm $NPM_VERSION is older than 11.5.1, which trusted publishing needs."
            exit 1
          fi

      # A retried or racing run can find the version already on npm (published by an earlier
      # attempt). Skip the publish then instead of failing, so the release step still runs.
      - name: Check npm does not have this version yet
        id: npm
        if: needs.package.outputs.published == 'false'
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          NAME="$(tar -xzOf ./release/*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
          # One registry response gives both the status and, if published, the integrity.
          METADATA="$RUNNER_TEMP/npm-metadata.json"
          if ! STATUS="$(curl --silent --show-error --output "$METADATA" --write-out '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")"; then
            echo "::error::Could not reach the npm registry."
            exit 1
          fi
          case "$STATUS" in
            200)
              # Only skip if npm holds exactly this tarball; anything else is a conflict.
              PUBLISHED="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).dist?.integrity ?? ""' "$METADATA")"
              LOCAL="sha512-$(openssl dgst -sha512 -binary ./release/*.tgz | base64 -w0)"
              if [ "$PUBLISHED" != "$LOCAL" ]; then
                echo "::error::$NAME@$VERSION is on npm with different contents ($PUBLISHED) than this run's tarball ($LOCAL)."
                exit 1
              fi
              echo "::notice::$NAME@$VERSION is already on npm with this exact tarball; skipping the publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unexpected HTTP status $STATUS from the npm registry."
              exit 1
              ;;
          esac

      # No NODE_AUTH_TOKEN: authentication comes from the OIDC identity of this workflow.
      # Publishing before tagging means a failed publish leaves no tag behind, so pushing the
      # fix re-runs cleanly instead of needing the tag deleted first.
      # --ignore-scripts: nothing from the package runs in this job.
      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        run: npm publish ./release/*.tgz --access public --ignore-scripts

      # Creates the tag at this commit as well as the release, so the tag only ever exists for
      # a version that actually shipped.
      - name: Tag and create the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.package.outputs.version }}
          name: v${{ needs.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
